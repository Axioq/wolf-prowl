# Copy this file to config/wolf-prowl.local.yaml for manual cycling contest testing.

database:
  path: data/wolf_prowl.duckdb

digest:
  output_dir: digests
  filename_template: "{date}.md"

topics:
  - name: cycling
    keywords:
      - cycling
      - bike
      - bicycle
      - mountain bike
      - gravel bike
      - road bike
    opportunity_terms:
      - giveaway
      - contest
      - sweepstakes
    excluded_terms:
      - expired
      - closed
      - sold
      - ended

source_templates:
  - name: Reddit search
    type: rss
    url_template: https://www.reddit.com/search.rss?q={query}&sort=new
    topics:
      - cycling
    enabled: true
    max_queries_per_topic: 8
