[project]
name = "wolf-prowl"
version = "0.1.0"
description = "Personal contest, sweepstakes, giveaway, and auction discovery utility."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "feedparser>=6.0.11",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
]

[project.scripts]
wolf-prowl = "wolf_prowl.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
